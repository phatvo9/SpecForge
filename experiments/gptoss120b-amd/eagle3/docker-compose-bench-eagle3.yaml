services:
  eagle3-bench:
    image: lmsysorg/sglang:v0.5.10.post1-rocm700-mi35x
    container_name: eagle3_bench
    shm_size: "64g"
    ipc: host
    network_mode: host
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      SGLANG_RECORD_STEP_TIME: "1"
      NCCL_DEBUG: "WARN"
    volumes:
      - /root/phat/SpecForge:/workspace/SpecForge
      - /home/claudeuser/specforge_data:/workspace/data:ro
      - /data3/phat/specforge/training:/workspace/checkpoints
      - ~/.cache/huggingface:/root/.cache/huggingface
    tty: true
    cap_add:
      - SYS_PTRACE
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    group_add:
      - video
    privileged: true
    ulimits:
      memlock: -1
      stack: 67108864
    working_dir: /workspace
    command: bash /workspace/data/bench_eagle3.sh
