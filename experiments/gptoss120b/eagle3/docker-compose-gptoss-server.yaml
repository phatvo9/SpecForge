services:
  gptoss-server:
    image: lmsysorg/sglang:v0.5.10.post1-rocm700-mi35x
    container_name: gptoss_server
    shm_size: "64g"
    ipc: host
    network_mode: host
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      AITER_LOG_LEVEL: "WARNING"
    volumes:
      - /root/phat/SpecForge:/workspace/SpecForge
      - /home/claudeuser/specforge_data:/workspace/data:ro
      - ~/.cache/huggingface:/root/.cache/huggingface
    tty: true
    cap_add:
      - SYS_PTRACE
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    group_add:
      - video
    privileged: true
    ulimits:
      memlock: -1
      stack: 67108864
    working_dir: /workspace
    command: bash /workspace/SpecForge/experiments/gptoss120b/eagle3/run_gptoss_server.sh
