services:
  kimi-k2.6-dflash-ft-regen-con:
    image: lmsysorg/sglang:v0.5.11-rocm700-mi35x
    container_name: kimi_k2.6_dflash_ft_regen_con
    shm_size: "64g"
    ipc: host
    network_mode: host
    environment:
      HF_HUB_TRUST_REMOTE_CODE: "1"
      TRUST_REMOTE_CODE: "true"
      TRANSFORMERS_TRUST_REMOTE_CODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      ROCR_VISIBLE_DEVICES: "1,2,5,7"
      PIP_CACHE_DIR: "/workspace/cache/pip"
      TRITON_CACHE_DIR: "/workspace/cache/triton"
      TORCHINDUCTOR_CACHE_DIR: "/workspace/cache/torchinductor"
      AITER_LOG_LEVEL: "WARNING"
      AITER_JIT_DIR: "/workspace/cache/aiter_jit"
      AMD_COMGR_CACHE_DIR: "/workspace/cache/comgr"
      NCCL_DEBUG: "WARN"
    volumes:
      - /root/phat/SpecForge:/workspace/SpecForge
      - /home/claudeuser/specforge_data:/workspace/data:ro
      - /data3/phat/specforge/dflash/kimi-k2.6:/workspace/checkpoints
      - /data3/phat/.cache:/root/.cache
      - /data3/phat/.cache/specforge:/workspace/cache
      - /data3/phat/.cache/tmp:/tmp
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    group_add:
      - video
    privileged: true
    ulimits:
      memlock: -1
      stack: 67108864
    working_dir: /workspace/cache
    command: >
      bash -c "export PYTHONPATH=/workspace/SpecForge:$$PYTHONPATH;
      ulimit -c 0;
      export GPU_COREDUMP_ENABLE=0;
      pip install --cache-dir /workspace/cache/pip yunchang wandb==0.19.11 2>&1 | tail -1;
      torchrun --standalone --nproc_per_node 4
      /workspace/SpecForge/experiments/kimi-k2.6/dflash/train_dflash_wrapper_kimi.py
      --target-model-path moonshotai/Kimi-K2.6
      --draft-config-path /workspace/checkpoints/dflash/kimi-k2.6-ft-regen-con/epoch_0_step_0/config.json
      --train-data-path /workspace/data/kimi-k2.6-eagle3-data/train_with_reasoning.jsonl
      --eval-data-path /workspace/data/kimi-k2.6-eagle3-data/eval_with_reasoning.jsonl
      --build-dataset-num-proc 16
      --output-dir /workspace/checkpoints/dflash/kimi-k2.6-ft-regen-con/
      --tp-size 4
      --target-model-backend sglang
      --sglang-attention-backend aiter
      --sglang-mem-fraction-static 0.9
      --sglang-context-length 20000
      --sglang-max-total-tokens 20000
      --trust-remote-code
      --num-epochs 5
      --batch-size 1
      --accumulation-steps 2
      --learning-rate 6e-5
      --warmup-ratio 0.05
      --max-grad-norm 1.0
      --max-length 20000
      --chat-template kimi-k2-instruct
      --attention-backend sdpa
      --block-size 8
      --num-anchors 800
      --loss-decay-gamma 6.0
      --mask-token-id 163838
      --embedding-key language_model.model.embed_tokens.weight
      --lm-head-key language_model.lm_head.weight
      --cache-dir /workspace/cache
      --dist-timeout 600
      --resume
      --save-interval 1000
      --eval-interval 500
      --log-interval 50
      --report-to tensorboard"
