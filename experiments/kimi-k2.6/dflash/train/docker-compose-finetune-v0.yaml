services:
  kimi-k2.6-dflash-ft:
    image: lmsysorg/sglang:v0.5.11-rocm700-mi35x
    container_name: kimi_k2.6_dflash_ft
    shm_size: "16g"
    ipc: host
    network_mode: host
    environment:
      HF_HUB_TRUST_REMOTE_CODE: "1"
      TRUST_REMOTE_CODE: "true"
      TRANSFORMERS_TRUST_REMOTE_CODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      ROCR_VISIBLE_DEVICES: "1"
      PIP_CACHE_DIR: "/workspace/cache/pip"
      TRITON_CACHE_DIR: "/workspace/cache/triton"
      TORCHINDUCTOR_CACHE_DIR: "/workspace/cache/torchinductor"
    volumes:
      - /root/phat/SpecForge:/workspace/SpecForge
      - /home/claudeuser/specforge_data:/workspace/data:ro
      - /data3/phat/specforge/dflash/kimi-k2.6:/workspace/checkpoints
      - /data3/phat/.cache:/root/.cache
      - /data3/phat/.cache/specforge:/workspace/cache
      - /data3/phat/.cache/tmp:/tmp
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    group_add:
      - video
    privileged: true
    ulimits:
      memlock: -1
      stack: 67108864
    working_dir: /workspace/cache
    command: >
      bash -c "export PYTHONPATH=/workspace/SpecForge:$$PYTHONPATH;
      ulimit -c 0;
      export GPU_COREDUMP_ENABLE=0;
      pip install --cache-dir /workspace/cache/pip yunchang wandb==0.19.11 2>&1 | tail -1;
      python3
      /workspace/SpecForge/experiments/kimi-k2.6/dflash/train_dflash_wrapper_kimi.py
      --target-model-path moonshotai/Kimi-K2.6
      --draft-config-path /workspace/checkpoints/dflash/kimi-k2.6-pretrain/epoch_0_step_150000/config.json
      --train-data-path /workspace/data/minimax2.7-spec-data/synthesis_25k_train.jsonl
      --eval-data-path /workspace/data/minimax2.7-spec-data/synthesis_25k_eval.jsonl
      --build-dataset-num-proc 96
      --output-dir /workspace/checkpoints/dflash/kimi-k2.6-finetune-v0/
      --tp-size 1
      --target-model-backend sglang-server
      --sglang-server-host 127.0.0.1
      --sglang-server-port 29700
      --trust-remote-code
      --num-epochs 3
      --batch-size 2
      --accumulation-steps 1
      --learning-rate 2e-4
      --warmup-ratio 0.05
      --max-grad-norm 1.0
      --max-length 16384
      --chat-template kimi-k2-instruct
      --attention-backend sdpa
      --block-size 8
      --num-anchors 1000
      --loss-decay-gamma 5.0
      --mask-token-id 163838
      --embedding-key language_model.model.embed_tokens.weight
      --lm-head-key language_model.lm_head.weight
      --cache-dir /workspace/cache
      --resume
      --save-interval 5000
      --eval-interval 1000
      --log-interval 50
      --report-to tensorboard"
