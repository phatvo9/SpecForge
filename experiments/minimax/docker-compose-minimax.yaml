services:
  minimax:
    image: dflash-bench:latest
    container_name: minimax_test
    shm_size: "64g"
    ipc: host
    network_mode: host
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      AITER_LOG_LEVEL: "WARNING"
    volumes:
      - /root/phat/SpecForge:/workspace/SpecForge
      - /data3/phat/.cache/huggingface:/root/.cache/huggingface
    tty: true
    cap_add:
      - SYS_PTRACE
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    group_add:
      - video
    privileged: true
    ulimits:
      memlock: -1
      stack: 67108864
    working_dir: /workspace
    command: bash /workspace/SpecForge/experiments/minimax/run_minimax.sh
