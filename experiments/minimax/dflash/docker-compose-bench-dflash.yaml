services:
  minimax-dflash-bench:
    image: lmsysorg/sglang:v0.5.10.post1-rocm700-mi35x
    container_name: minimax_dflash_bench
    shm_size: "64g"
    ipc: host
    network_mode: host
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      AITER_LOG_LEVEL: "WARNING"
    volumes:
      - /root/phat/SpecForge:/workspace/SpecForge
      - /data3/phat/specforge/dflash/minimax-m2.7/dflash/minimax-m2.7-v3:/workspace/dflash_checkpoint:ro
      - /data3/phat/.cache/huggingface:/root/.cache/huggingface
      - /root/phat/official_sglang:/workspace/official_sglang
    tty: true
    cap_add:
      - SYS_PTRACE
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    group_add:
      - video
    privileged: true
    ulimits:
      memlock: -1
      stack: 67108864
    working_dir: /workspace
    command: bash /workspace/SpecForge/experiments/minimax/dflash/bench_dflash.sh
