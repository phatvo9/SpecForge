services:
  minimax-dflash-long-ctx-ft4:
    image: lmsysorg/sglang:v0.5.10.post1-rocm700-mi35x
    container_name: minimax_dflash_long_ctx_ft4
    shm_size: "64g"
    ipc: host
    network_mode: host
    environment:
      HF_TOKEN: "${HF_TOKEN}"
      NCCL_DEBUG: "WARN"
      AITER_LOG_LEVEL: "WARNING"
    volumes:
      - /root/phat/SpecForge:/workspace/SpecForge
      - /home/claudeuser/specforge_data:/workspace/data:ro
      - /data3/phat/specforge/dflash/minimax-m2.7:/workspace/checkpoints
      - /data3/phat/.cache/huggingface:/root/.cache/huggingface
    tty: true
    cap_add:
      - SYS_PTRACE
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    group_add:
      - video
    privileged: true
    ulimits:
      memlock: -1
      stack: 67108864
    working_dir: /workspace
    command: bash /workspace/SpecForge/experiments/minimax/dflash/train_minimax_dflash_long_ctx_ft4.sh
